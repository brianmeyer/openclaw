# Graphiti Local Stack - Temporal Knowledge Graph for OpenClaw
#
# Usage:
#   cd skills/graphiti
#   docker compose up -d
#
# Then configure OpenClaw:
#   openclaw config set env.GRAPHITI_MCP_URL http://localhost:8000

services:
  neo4j:
    image: neo4j:5.26
    ports:
      - "7474:7474"  # HTTP (Browser UI)
      - "7687:7687"  # Bolt protocol
    environment:
      NEO4J_AUTH: neo4j/Greyson0217
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Ollama for local embeddings
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Pull embedding model on first run:
    # docker exec -it graphiti-ollama-1 ollama pull embeddinggemma

  graphiti-mcp:
    image: zepai/graphiti-mcp:latest
    ports:
      - "8000:8000"
    environment:
      # Neo4j connection
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: Greyson0217
      # LLM provider: OpenAI for inference + Ollama for embeddings
      MODEL_PROVIDER: openai
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: gpt5-mini
      OPENAI_MODEL_SMALL: gpt5-nano
      # Embeddings via local Ollama
      EMBEDDING_PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_EMBEDDING_MODEL: embeddinggemma
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  neo4j_data:
  neo4j_logs:
  ollama_data:
